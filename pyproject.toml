[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-forge-public-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pytest>=8,<10", "pytest-playwright>=0.6,<1", "playwright>=1.50,<2", "httpx>=0.27,<1", "allure-pytest>=2.13,<3", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests", "api: API tests"]
